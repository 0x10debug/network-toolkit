# oauth2-proxy.yml — OAuth2 Proxy v7.7.0 SSO/OIDC gateway (docker-compose)
#
# Pinned to quay.io/oauth2-proxy/oauth2-proxy:v7.7.0 (never :latest). Port
# 4180 is bound to 127.0.0.1 so the proxy is never reachable directly from
# the public internet — traffic must come through the reverse proxy
# (Caddy/Traefik) via forward_auth. The provider is selected by
# OAUTH2_PROXY_PROVIDER in .env (google | github | oidc).
#
# Usage:
#   1. cp .env.example .env  && edit .env (provider, client id/secret, secret)
#   2. docker network create mb-proxy   (once per host, if not present)
#   3. docker compose -f oauth2-proxy.yml up -d
#   4. Wire your reverse proxy forward_auth to http://oauth2-proxy:4180
#      — see traefik-middleware.yml / caddy-handler.yml for snippets.

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.0
    container_name: oauth2-proxy
    restart: unless-stopped
    command:
      - "--config=/etc/oauth2-proxy/oauth2-proxy.cfg"
    ports:
      - "127.0.0.1:4180:4180"   # never expose publicly — reverse proxy only
    environment:
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROXY_PROVIDER:-google}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:-}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL:-https://auth.${PRIMARY_DOMAIN}/oauth2/callback}
      OAUTH2_PROXY_UPSTREAMS: ${OAUTH2_PROXY_UPSTREAMS:-http://127.0.0.1:8080}
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PREFER_EMAIL_TO_USER: "true"
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:4180/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mb-proxy

networks:
  mb-proxy:
    external: true
    name: ${MB_PROXY_NETWORK:-mb-proxy}
