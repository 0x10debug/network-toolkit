# nginx-mtls.conf — Nginx mTLS (mutual TLS) configuration example
#
# Requires the server certificate/key and the CA certificate that signed the
# client certificates. Generate them with generate-certs.sh:
#
#   ./generate-certs.sh --domain api.example.com --outdir ./certs
#
# Then mount the certs into the Nginx container and reference them below.
# `ssl_verify_client on` means Nginx rejects any connection that does not
# present a valid client certificate signed by the trusted CA.

server {
    listen 443 ssl;
    server_name api.example.com;   # ← change to your domain

    # ── Server certificate (proves server identity to client) ───────────────
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ── mTLS: verify client certificate ─────────────────────────────────────
    # The CA certificate that signed your client certs. Nginx checks every
    # connecting client's cert against this CA.
    ssl_client_certificate /etc/nginx/certs/ca.crt;

    # on  = require valid client cert (reject without one)
    # on  = mTLS enforced; optional = request cert but allow missing
    ssl_verify_client on;

    # How deep in the chain to verify (1 = client cert signed directly by CA,
    # 2 = one intermediate). Use 1 for the simple CA→client setup from
    # generate-certs.sh; increase if you add intermediate CAs.
    ssl_verify_depth 2;

    # Modern TLS — no old protocols/ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Pass client cert info to the backend (optional) ─────────────────────
    # These headers let your app identify the authenticated client. Ensure
    # the reverse proxy strips them from incoming requests so clients can't
    # spoof them.
    proxy_set_header X-SSL-Client-Verify  $ssl_client_verify;
    proxy_set_header X-SSL-Client-DN      $ssl_client_fingerprint;
    proxy_set_header X-SSL-Client-CN      $ssl_client_s_dn_cn;
    proxy_set_header X-SSL-Client-Issuer  $ssl_client_i_dn;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Optional: reject non-mTLS connections on port 80 ─────────────────────────
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
