# Multi-Site Template — multiple domains on one Caddy reverse proxy
#
# One Caddy instance terminates TLS for several domains and forwards each to
# its own backend app on the shared mb-proxy network.
#
# Usage:
#   1. Copy .env.example -> .env and fill in SITE_1_* and SITE_2_* values
#   2. Copy Caddyfile.example -> Caddyfile and add/remove site blocks as needed
#   3. docker compose up -d

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_1_DOMAIN: ${SITE_1_DOMAIN}
      SITE_1_HOST: ${SITE_1_HOST}
      SITE_1_PORT: ${SITE_1_PORT}
      SITE_2_DOMAIN: ${SITE_2_DOMAIN}
      SITE_2_HOST: ${SITE_2_HOST}
      SITE_2_PORT: ${SITE_2_PORT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data/caddy/data
      - caddy-config:/data/caddy/config
    networks:
      - mb-proxy

volumes:
  caddy-data:
  caddy-config:

networks:
  mb-proxy:
    external: true
    name: ${MB_PROXY_NETWORK:-mb-proxy}
