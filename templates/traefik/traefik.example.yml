# traefik.example.yml — user-facing Traefik v3.6 static configuration example
#
# Copy to traefik.yml and edit for your environment. This mirrors the bundled
# templates/traefik/traefik.yml but is intended as a starting point you own
# and customize. The compose file mounts ./traefik.yml into the container.
#
# Key things to set:
#   - ${PRIMARY_DOMAIN} / ${ACME_EMAIL} come from .env
#   - entryPoints: keep 80/443/8080 unless you have port conflicts
#   - providers.docker.network: must match your mb-proxy network name

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "${PRIMARY_DOMAIN}"
            sans:
              - "*.${PRIMARY_DOMAIN}"

  traefik:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "${MB_PROXY_NETWORK:-mb-proxy}"
    watch: true

  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: "/acme/acme.json"
      tlsChallenge: {}

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: traefik

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        Authorization: drop
        Cookie: drop
        Set-Cookie: drop

# Uncomment when you have an OTLP/Jaeger collector running.
# tracing:
#   serviceName: traefik
#   otlp:
#     endpoint: "otel-collector:4318"
#     protocol: http

global:
  checkNewVersion: false
  sendAnonymousUsage: false
