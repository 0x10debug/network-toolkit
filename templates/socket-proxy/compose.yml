# compose.yml — Docker socket-proxy with allowlist-based API filtering
#
# Pinned to tecnativa/docker-socket-proxy:0.1.5 (never :latest). The host
# Docker socket is mounted read-only into the proxy, which exposes a filtered
# subset of the Docker API on :2375 inside an internal Docker network. No
# ports are published to the host — only containers on the same network can
# reach it. Every API endpoint defaults to denied (0); flip the ones you need
# to 1 in .env. POST defaults to 0 so container create/kill/exec is blocked
# even when CONTAINERS=1 allows listing.
#
# Usage:
#   1. cp .env.example .env  && edit .env (only enable the endpoints you need)
#   2. docker network create mb-socket-proxy   (once per host, internal)
#   3. docker compose up -d
#   4. Point other services at http://socket-proxy:2375
#      (e.g. DOCKER_HOST=tcp://socket-proxy:2375) on the mb-socket-proxy net

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1.5
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      # ── Read-only endpoints (GET/HEAD only when =1) ──────────────────────
      CONTAINERS: ${CONTAINERS:-1}
      EXEC: ${EXEC:-0}
      IMAGES: ${IMAGES:-0}
      INFO: ${INFO:-0}
      NETWORKS: ${NETWORKS:-0}
      NODES: ${NODES:-0}
      PLUGINS: ${PLUGINS:-0}
      SERVICES: ${SERVICES:-0}
      SESSION: ${SESSION:-0}
      SWARM: ${SWARM:-0}
      SYSTEM: ${SYSTEM:-0}
      TASKS: ${TASKS:-0}
      VOLUMES: ${VOLUMES:-0}
      # ── Write endpoints (POST/PUT/DELETE when =1) ────────────────────────
      POST: ${POST:-0}
      BUILD: ${BUILD:-0}
      COMMIT: ${COMMIT:-0}
      CONFIGS: ${CONFIGS:-0}
      DISTRIBUTION: ${DISTRIBUTION:-0}
      EVENTS: ${EVENTS:-0}
      SECRETS: ${SECRETS:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:2375/version', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mb-socket-proxy

networks:
  mb-socket-proxy:
    external: true
    name: ${MB_SOCKET_PROXY_NETWORK:-mb-socket-proxy}
