# ── Load-balancing methods summary ───────────────────────────────────────────
# | Method      | Directive    | Behavior                          | Use case          |
# |-------------|--------------|-----------------------------------|-------------------|
# | round_robin | (default)    | Even distribution in order        | General purpose   |
# | ip_hash     | ip_hash;     | Sticky by client IP               | Session affinity  |
# | least_conn  | least_conn;  | Fewest active connections         | Varying load      |
#
# ── Health check parameters ──────────────────────────────────────────────────
# max_fails=3       — mark server down after 3 failed requests
# fail_timeout=30s  — server is considered down for 30s after max_fails
# backup            — only used when all non-backup servers are down
