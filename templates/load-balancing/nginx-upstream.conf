# nginx-upstream.conf — Nginx 1.27 load balancer upstream configuration
#
# Demonstrates three load-balancing methods (round_robin, ip_hash, least_conn),
# active health checks via max_fails/fail_timeout, and failover with backup.
# Mount as /etc/nginx/conf.d/default.conf (see nginx-upstream.yml).

# ── Upstream pool: round_robin (default) ─────────────────────────────────────
# Requests are distributed evenly across servers in order. This is Nginx's
# default when no balancing directive is specified.
upstream api_backend {
    # round_robin is implicit — no directive needed
    server api1:8080 max_fails=3 fail_timeout=30s;
    server api2:8080 max_fails=3 fail_timeout=30s;
    server api3:8080 max_fails=3 fail_timeout=30s backup;  # failover only
}

# ── Upstream pool: ip_hash (session persistence) ─────────────────────────────
# Same client IP always goes to the same server (sticky sessions by IP).
# Use when backends store session state locally and you can't use shared
# session storage (Redis, etc.).
upstream web_backend_iphash {
    ip_hash;
    server web1:80 max_fails=3 fail_timeout=30s;
    server web2:80 max_fails=3 fail_timeout=30s;
}

# ── Upstream pool: least_conn (fewest connections) ───────────────────────────
# Sends each request to the server with the fewest active connections.
# Better than round_robin when requests have varying processing times.
upstream web_backend_leastconn {
    least_conn;
    server web1:80 max_fails=3 fail_timeout=30s;
    server web2:80 max_fails=3 fail_timeout=30s;
}

# ── HTTP server ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.example.com www.example.com;

    # Health check endpoint for the LB itself (used by docker healthcheck)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Route API requests to the round_robin pool
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Failover: if all upstream servers fail, return 502
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Route web requests to the ip_hash pool (sticky sessions)
    location / {
        proxy_pass http://web_backend_iphash;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

