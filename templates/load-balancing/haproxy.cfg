# haproxy.cfg — HAProxy 3.1 load balancer configuration
#
# Demonstrates: HTTP/HTTPS frontends, backend server pool with roundrobin +
# active health checks, SSL termination with SNI, and a stats page.
#
# Mount this file as /usr/local/etc/haproxy/haproxy.cfg (see haproxy.yml).
# Place your TLS certs (PEM: cert + key concatenated) in ./certs/.

global
    log stdout format raw local0
    maxconn 4096
    # Run as the haproxy user inside the container
    user haproxy
    group haproxy
    # Quiet SSL warnings from self-signed certs in dev
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout http-request 10s

# ── Stats page ───────────────────────────────────────────────────────────────
# Bound to port 9999 (compose maps 127.0.0.1:9999). View in browser at
# http://127.0.0.1:9999/stats. Set STATS_USER / STATS_PASSWORD in .env or
# replace the hardcoded credentials below.
frontend stats
    bind *:9999
    mode http
    http_request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats admin if TRUE
    # Replace with secure credentials in production
    stats auth admin:changeme

# ── HTTP frontend (port 80) ──────────────────────────────────────────────────
# Redirects all HTTP traffic to HTTPS. Remove this frontend if you only
# need HTTPS.
frontend http_in
    bind *:80
    mode http
    http-request redirect scheme https code 301

# ── HTTPS frontend (port 443) — SSL termination ──────────────────────────────
# Terminates TLS with the server certificate, then forwards decrypted HTTP
# to the backend pool. For SNI-based passthrough (no termination), use
# mode tcp + tcp-request inspect-delay instead (see comment below).
frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/server.pem alpn h2,http/1.1
    mode http

    # Route by Host header to different backend pools
    acl is_api hdr(host) -i api.example.com
    acl is_web hdr(host) -i www.example.com

    use_backend api_pool   if is_api
    use_backend web_pool   if is_web
    default_backend web_pool

# ── SNI passthrough alternative (no SSL termination) ─────────────────────────
# Use this if backends handle their own TLS and HAProxy should only route
# by SNI without decrypting. Comment out the https_in frontend above and
# uncomment this:
#
# frontend https_passthrough
#     bind *:443
#     mode tcp
#     tcp-request inspect-delay 5s
#     tcp-request content accept if { req.ssl_hello_type 1 }
#     acl is_api req.ssl_sni -i api.example.com
#     use_backend api_pool_tcp if is_api
#     default_backend web_pool_tcp

# ── Backend pools ────────────────────────────────────────────────────────────

# API backend — roundrobin with active health checks
backend api_pool
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server api1 api1:8080 check
    server api2 api2:8080 check
    server api3 api3:8080 check backup   # backup = only used if all others down

# Web backend — leastconn (fewest active connections)
backend web_pool
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server web1 web1:80 check
    server web2 web2:80 check

# ── TCP backends for SNI passthrough (uncomment if using passthrough) ────────
# backend api_pool_tcp
#     mode tcp
#     balance roundrobin
#     server api1 api1:443 check
#     server api2 api2:443 check
#
# backend web_pool_tcp
#     mode tcp
#     balance roundrobin
#     server web1 web1:443 check
#     server web2 web2:443 check
