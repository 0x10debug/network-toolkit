#!/usr/sbin/nft -f
#
# nftables.conf — edge firewall ruleset for a VPS running the network-toolkit
#
# Default-deny inbound, allow established/related, loopback, rate-limited SSH,
# and HTTP/HTTPS for reverse-proxy templates. Forwarding is denied (the VPS is
# an endpoint, not a router). Bogon and blocklist filtering via ipset.
#
# Install:
#   sudo nft -f nftables.conf
# Persist (Debian/Ubuntu):
#   sudo nft list ruleset > /etc/nftables.conf
#   sudo systemctl enable --now nftables
#
# This is a complete (flush) ruleset. Loading it replaces the current ruleset.

flush ruleset

# ── Tables ───────────────────────────────────────────────────────────────────

table inet edge {
    # Named sets --------------------------------------------------------------
    # Bogon/martian source addresses — should never appear on the public
    # internet. Drop them early in input and forward.
    set bogons {
        type ipv4_addr
        flags interval
        elements = {
            0.0.0.0/8,        # "this network"
            10.0.0.0/8,       # RFC1918
            100.64.0.0/10,    # CGNAT
            127.0.0.0/8,      # loopback (handled separately, but belt+suspenders)
            169.254.0.0/16,   # link-local
            172.16.0.0/12,    # RFC1918
            192.0.0.0/24,     # IETF protocol assignments
            192.0.2.0/24,     # TEST-NET-1
            192.168.0.0/16,   # RFC1918
            198.18.0.0/15,    # benchmarking
            198.51.100.0/24,  # TEST-NET-2
            203.0.113.0/24,   # TEST-NET-3
            224.0.0.0/4,      # multicast
            240.0.0.0/4       # reserved
        }
    }

    set bogons6 {
        type ipv6_addr
        flags interval
        elements = {
            ::/128,           # unspecified
            ::1/128,          # loopback
            fc00::/7,         # ULA
            fe80::/10,        # link-local
            ff00::/8,         # multicast
            2001:db8::/32     # documentation
        }
    }

    # External blocklist populated by ipset-blocklist.conf update script.
    # The script loads CIDRs here via `nft add element inet edge blocklistv4 { ... }`.
    set blocklistv4 {
        type ipv4_addr
        flags interval
        # elements = { }  # populated dynamically
    }

    # ── input chain ──────────────────────────────────────────────────────────
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow all loopback traffic.
        iif "lo" accept

        # Drop invalid connection states.
        ct state invalid drop

        # Allow established and related connections (return traffic).
        ct state established,related accept

        # Drop bogon source addresses on the public interface.
        iif != "lo" ip saddr @bogons drop
        iif != "lo" ip6 saddr @bogons6 drop

        # Drop anything from the dynamic blocklist.
        ip saddr @blocklistv4 drop

        # ICMP — allow essential ICMPv4 for path MTU discovery and ping.
        ip protocol icmp icmp type echo-request limit rate 5/second accept
        ip protocol icmp icmp type destination-unreachable accept
        ip protocol icmp icmp type time-exceeded accept
        ip protocol icmp icmp type parameter-problem accept
        ip protocol icmp icmp type packet-too-big accept

        # ICMPv6 — required for IPv6 to function (NDP, MLD, PMTUD).
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, router-solicit, router-advert, packet-too-big, destination-unreachable, time-exceeded, parameter-problem } accept

        # SSH — rate limited to defeat brute force.
        # 5 new connections per minute per source; bursts over that are dropped.
        tcp dport 22 ct state new limit rate 5/minute burst 5 packets accept comment "SSH rate-limited"
        tcp dport 22 ct state new drop comment "SSH brute-force drop"

        # HTTP / HTTPS for reverse-proxy templates (Caddy/Traefik).
        tcp dport { 80, 443 } accept comment "HTTP/HTTPS"
        udp dport 443 accept comment "HTTP/3 (QUIC)"

        # frp tunnel server port (only if using the tunnel/full-stack template).
        # Uncomment if you deploy templates/tunnel:
        # tcp dport 7000 accept comment "frp server"

        # Everything else is dropped by the chain policy.
    }

    # ── forward chain ────────────────────────────────────────────────────────
    chain forward {
        type filter hook forward priority 0; policy drop;

        # This VPS is an endpoint, not a router. Deny all forwarding.
        # If you enable Docker on a bridge, Docker manages its own forwarding
        # rules in its own table; this chain governs host-level routing only.
        ct state established,related accept
        iif "lo" accept
    }

    # ── output chain ─────────────────────────────────────────────────────────
    chain output {
        type filter hook output priority 0; policy accept;

        # Allow all outbound (cloudflared tunnels, DNS, package updates, etc.).
        # Restrict here only if you need egress filtering.
    }
}

# ── Optional: GeoIP-based blocking ───────────────────────────────────────────
# nftables has no built-in GeoIP. To block by country, maintain an ipset/nft
# set of country ASN CIDRs (e.g. from ipdeny.com or Maxmind) and reference it:
#
#   table inet edge {
#       set geoip_block {
#           type ipv4_addr; flags interval;
#           elements = { <CIDRs from country X> }
#       }
#       chain input {
#           ip saddr @geoip_block drop
#       }
#   }
#
# Update the set periodically with a cron job that fetches the latest CIDR
# lists. See ipset-blocklist.conf for an auto-update script pattern.
