# ipset-blocklist.conf — IP blocklist sources and auto-update reference
#
# Maintains an nftables set (`inet edge blocklistv4`) of known malicious
# networks. Sources are public blocklists (Spamhaus, Emerging Threats,
# AbuseIPDB). The update script below fetches, dedupes, and loads CIDRs into
# the running nftables ruleset.
#
# This file is a reference, not sourced. Copy the script section into
# /usr/local/sbin/update-nft-blocklist.sh and run it from cron.

# ── Blocklist sources ────────────────────────────────────────────────────────
# Each source is a plain-text list of CIDRs or single IPs, one per line.
# Comments (#) and blank lines are ignored by the update script.

SOURCES="
https://www.spamhaus.org/drop/drop.txt
https://www.spamhaus.org/drop/edrop.txt
https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt
"

# AbuseIPDB requires an API key for its blocklist export. If you have one,
# set ABUSEIPDB_KEY and the script will include AbuseIPDB entries.
# Leave blank to skip.
ABUSEIPDB_KEY=""

# ── Known malicious IP ranges (static seed) ──────────────────────────────────
# A small static seed of well-known bad ranges to bootstrap the set before the
# first remote fetch succeeds. The dynamic sources above supersede and expand
# this list. Replace with current data from the live feeds.

STATIC_SEED="
# Spamhaus DROP (subset — full list fetched dynamically)
193.0.146.0/23
194.165.56.0/24
# Known SSH brute-force botnets (examples — replace with live data)
45.227.255.0/24
185.220.101.0/24
"

# ── Auto-update script ───────────────────────────────────────────────────────
# Save the block below as /usr/local/sbin/update-nft-blocklist.sh, then:
#   chmod +x /usr/local/sbin/update-nft-blocklist.sh
#   /usr/local/sbin/update-nft-blocklist.sh
# Schedule via cron (root):
#   17 4 * * * /usr/local/sbin/update-nft-blocklist.sh
#
# The script is idempotent: it rebuilds the set from scratch each run, so
# removing a source removes its CIDRs too.

