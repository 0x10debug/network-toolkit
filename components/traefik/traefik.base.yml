# traefik.base.yml — minimal Traefik v3.6 static configuration
#
# Skeleton for a custom deployment. Copy to traefik.yml and fill in
# ${PRIMARY_DOMAIN} / ${ACME_EMAIL} via .env. See components/traefik/README.md.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "${PRIMARY_DOMAIN}"
            sans:
              - "*.${PRIMARY_DOMAIN}"

  traefik:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "${MB_PROXY_NETWORK:-mb-proxy}"
    watch: true

  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: "/acme/acme.json"
      tlsChallenge: {}

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: traefik

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        Authorization: drop
        Cookie: drop
        Set-Cookie: drop

global:
  checkNewVersion: false
  sendAnonymousUsage: false
